spring.application.name=apipetshop

#Spring config properties
spring.config.import=optional:file:.env[.properties]

# ── Banco de Dados MySQL ──────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_User}
spring.datasource.password=${DB_Password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# validate  -> valida o schema sem alterar (recomendado em produção)
# update    -> atualiza o schema automaticamente (útil em dev)
# create    -> recria as tabelas a cada start (apaga os dados)
# none      -> não faz nada
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Inicialização via SQL ────────────────────────────────────
# O schema.sql só é executado se ddl-auto=none ou never
# Mantenha esta linha comentada quando usar ddl-auto=validate/update
# spring.sql.init.mode=always
