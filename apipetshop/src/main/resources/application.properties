spring.application.name=apipetshop

# ── Banco de Dados MySQL ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/petshop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234@Smd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# validate  -> valida o schema sem alterar (recomendado em produção)
# update    -> atualiza o schema automaticamente (útil em dev)
# create    -> recria as tabelas a cada start (apaga os dados)
# none      -> não faz nada
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Inicialização via SQL ────────────────────────────────────
# O schema.sql só é executado se ddl-auto=none ou never
# Mantenha esta linha comentada quando usar ddl-auto=validate/update
# spring.sql.init.mode=always
